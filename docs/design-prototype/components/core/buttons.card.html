<!-- @dsCard group="Components" viewport="700x300" name="Buttons" subtitle="Button variants + sizes, and IconButton" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; padding:22px; background:var(--surface-card); }
  .group { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .eyebrow { font-size:9.5px; font-weight:600; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--text-subtle); width:100%; margin-bottom:2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.LinkedInDMQueueDesignSystem_ee8eb0;
  const I = ({ n, s = 15 }) => <i data-lucide={n} style={{ width: s, height: s, display: 'inline-flex' }}></i>;

  function Demo() {
    return (
      <div>
        <div className="group"><span className="eyebrow">Variants</span>
          <Button variant="primary" icon={<I n="play" />}>Start sending</Button>
          <Button variant="secondary">Cancel</Button>
          <Button variant="ghost" icon={<I n="filter" />}>Filter</Button>
          <Button variant="danger" icon={<I n="trash-2" />}>Clear all data</Button>
        </div>
        <div className="group"><span className="eyebrow">Sizes</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="group"><span className="eyebrow">Icon buttons</span>
          <IconButton variant="accent" label="Add"><I n="plus" s={16} /></IconButton>
          <IconButton variant="solid" label="Settings"><I n="settings" /></IconButton>
          <IconButton variant="ghost" label="Edit"><I n="pencil" /></IconButton>
          <IconButton variant="ghost" label="Open profile"><I n="external-link" /></IconButton>
          <IconButton variant="danger" label="Delete"><I n="trash-2" /></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }), 60);
</script>
</body>
</html>
