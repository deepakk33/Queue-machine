<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px grid — the rhythm of a 360px panel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:7px; }
  .bar { height: 14px; background: var(--accent-weak); border:1px solid var(--blue-200); border-radius: 3px; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 96px; }
</style>
</head>
<body>
  <div class="row"><span class="lab">2 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lab">3 · 6px</span><div class="bar" style="width:6px"></div></div>
  <div class="row"><span class="lab">4 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lab">6 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lab">8 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lab">12 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lab">16 · 32px</span><div class="bar" style="width:32px"></div></div>
</body>
</html>
