<!-- @dsCard group="Colors" viewport="700x150" name="Accent · Dusty purple" subtitle="The single primary-action / link hue. Used sparingly." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); border: 1px solid var(--border-default); }
  .sw { flex: 1; height: 76px; display: flex; align-items: flex-end; padding: 6px; position: relative; }
  .sw span { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; }
  .tag { position:absolute; top:6px; left:6px; font-family:var(--font-sans); font-size:9px; font-weight:600; color:var(--slate-0); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--blue-50);"><span style="color:var(--blue-700)">50</span></div>
    <div class="sw" style="background:var(--blue-100);"><span style="color:var(--blue-700)">100</span></div>
    <div class="sw" style="background:var(--blue-200);"><span style="color:var(--blue-700)">200</span></div>
    <div class="sw" style="background:var(--blue-300);"><span style="color:var(--blue-700)">300</span></div>
    <div class="sw" style="background:var(--blue-400);"><span style="color:var(--slate-0)">400</span></div>
    <div class="sw" style="background:var(--blue-500);"><span class="tag">accent</span><span style="color:var(--slate-0)">500</span></div>
    <div class="sw" style="background:var(--blue-600);"><span class="tag">hover</span><span style="color:var(--slate-0)">600</span></div>
    <div class="sw" style="background:var(--blue-700);"><span class="tag">active</span><span style="color:var(--slate-0)">700</span></div>
  </div>
</body>
</html>
