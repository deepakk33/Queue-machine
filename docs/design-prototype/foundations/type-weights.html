<!-- @dsCard group="Type" viewport="700x130" name="Weights" subtitle="IBM Plex Sans 400 / 500 / 600 / 700 in use" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .row { display: flex; gap: 26px; align-items: baseline; }
  .w { display:flex; flex-direction:column; gap:3px; }
  .w b { font-size: 22px; color: var(--text-strong); }
  .w span { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="w"><b style="font-weight:400">Queue</b><span>400 · regular · body</span></div>
    <div class="w"><b style="font-weight:500">Queue</b><span>500 · medium · labels</span></div>
    <div class="w"><b style="font-weight:600">Queue</b><span>600 · semibold · titles</span></div>
    <div class="w"><b style="font-weight:700">Queue</b><span>700 · bold · emphasis</span></div>
  </div>
</body>
</html>
