<!-- @dsCard group="Colors" viewport="700x190" name="Status semantics" subtitle="pending · sending · sent · failed · skipped — bg / fg / dot" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--weight-semibold); }
  .dot { width: 7px; height: 7px; border-radius: var(--radius-pill); }
  .pulse { animation: pulse 1.4s var(--ease-in-out) infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
  .code { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle); }
  .swatch { width: 100%; height: 26px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <span class="pill" style="background:var(--status-pending-bg);color:var(--status-pending-fg)"><span class="dot" style="background:var(--status-pending-dot)"></span>pending</span>
      <div class="swatch" style="background:var(--status-pending-bg)"></div>
      <span class="code">slate</span>
    </div>
    <div class="col">
      <span class="pill" style="background:var(--status-sending-bg);color:var(--status-sending-fg)"><span class="dot pulse" style="background:var(--status-sending-dot)"></span>sending</span>
      <div class="swatch" style="background:var(--status-sending-bg)"></div>
      <span class="code">sky</span>
    </div>
    <div class="col">
      <span class="pill" style="background:var(--status-sent-bg);color:var(--status-sent-fg)"><span class="dot" style="background:var(--status-sent-dot)"></span>sent</span>
      <div class="swatch" style="background:var(--status-sent-bg)"></div>
      <span class="code">emerald</span>
    </div>
    <div class="col">
      <span class="pill" style="background:var(--status-failed-bg);color:var(--status-failed-fg)"><span class="dot" style="background:var(--status-failed-dot)"></span>failed</span>
      <div class="swatch" style="background:var(--status-failed-bg)"></div>
      <span class="code">red</span>
    </div>
    <div class="col">
      <span class="pill" style="background:var(--status-skipped-bg);color:var(--status-skipped-fg)"><span class="dot" style="background:var(--status-skipped-dot)"></span>skipped</span>
      <div class="swatch" style="background:var(--status-skipped-bg)"></div>
      <span class="code">amber</span>
    </div>
  </div>
</body>
</html>
