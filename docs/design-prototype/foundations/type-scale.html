<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Fraunces display, IBM Plex Sans body, at panel sizes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: 0; }
  .lab { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle); width: 132px; flex-shrink:0; }
  .spec { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row"><span class="lab">display 2xl · 24</span><span class="spec" style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:600;letter-spacing:var(--tracking-tight)">Sending 4 of 12</span></div>
  <div class="row"><span class="lab">display xl · 22</span><span class="spec" style="font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:var(--tracking-tight)">Your queue</span></div>
  <div class="row"><span class="lab">display lg · 20</span><span class="spec" style="font-family:var(--font-display);font-size:20px;font-weight:600">Add a prospect</span></div>
  <div class="row"><span class="lab">md · 15 / 600</span><span class="spec" style="font-size:var(--text-md);font-weight:600">Dana Reed</span></div>
  <div class="row"><span class="lab">base · 13.5 / 400</span><span class="spec" style="font-size:var(--text-base)">VP Growth at Northbeam — added to queue today.</span></div>
  <div class="row"><span class="lab">sm · 12.5 / 400</span><span class="spec" style="font-size:var(--text-sm);color:var(--text-muted)">Helper and secondary copy sits here.</span></div>
  <div class="row"><span class="lab">xs · 11.5 / 500</span><span class="spec" style="font-size:var(--text-xs);font-weight:500;color:var(--text-muted)">Caption · meta · badge text</span></div>
</body>
</html>
