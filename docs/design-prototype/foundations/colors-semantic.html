<!-- @dsCard group="Colors" viewport="700x170" name="Semantic surfaces & text" subtitle="App background, card, sunken, and the text hierarchy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-app); display:flex; gap:14px; }
  .surfaces { display:flex; gap:10px; flex:1; }
  .surf { flex:1; height: 110px; border-radius: var(--radius-md); border:1px solid var(--border-default); display:flex; flex-direction:column; justify-content:flex-end; padding:8px; }
  .surf b { font-size:var(--text-xs); font-weight:600; color:var(--text-body); }
  .surf span { font-family:var(--font-mono); font-size:9px; color:var(--text-subtle); }
  .text { flex:1; display:flex; flex-direction:column; justify-content:center; gap:7px; padding-left:6px; }
  .text div { display:flex; align-items:baseline; gap:8px; }
  .text .lab { font-family:var(--font-mono); font-size:9px; color:var(--text-subtle); width:78px; }
</style>
</head>
<body>
  <div class="surfaces">
    <div class="surf" style="background:var(--bg-app)"><b>app</b><span>--bg-app</span></div>
    <div class="surf" style="background:var(--surface-card);box-shadow:var(--shadow-xs)"><b>card</b><span>--surface-card</span></div>
    <div class="surf" style="background:var(--surface-sunken)"><b>sunken</b><span>--surface-sunken</span></div>
  </div>
  <div class="text">
    <div><span class="lab">strong</span><span style="color:var(--text-strong);font-size:15px;font-weight:600">Dana Reed</span></div>
    <div><span class="lab">body</span><span style="color:var(--text-body);font-size:13.5px">VP Growth, Northbeam</span></div>
    <div><span class="lab">muted</span><span style="color:var(--text-muted);font-size:12.5px">Added 2 days ago</span></div>
    <div><span class="lab">subtle</span><span style="color:var(--text-subtle);font-size:11.5px">No message yet</span></div>
    <div><span class="lab">link</span><span style="color:var(--text-link);font-size:12.5px;font-weight:500">View profile</span></div>
  </div>
</body>
</html>
