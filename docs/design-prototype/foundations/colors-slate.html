<!-- @dsCard group="Colors" viewport="700x150" name="Neutral · Slate ramp" subtitle="The structural neutral scale — backgrounds, borders, text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); border: 1px solid var(--border-default); }
  .sw { flex: 1; height: 76px; display: flex; align-items: flex-end; padding: 6px; }
  .sw span { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; }
  .labels { display: flex; margin-top: 8px; }
  .labels div { flex: 1; font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted); text-align: left; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--slate-0);"><span style="color:var(--slate-500)">0</span></div>
    <div class="sw" style="background:var(--slate-50);"><span style="color:var(--slate-500)">50</span></div>
    <div class="sw" style="background:var(--slate-100);"><span style="color:var(--slate-600)">100</span></div>
    <div class="sw" style="background:var(--slate-200);"><span style="color:var(--slate-600)">200</span></div>
    <div class="sw" style="background:var(--slate-300);"><span style="color:var(--slate-700)">300</span></div>
    <div class="sw" style="background:var(--slate-400);"><span style="color:var(--slate-0)">400</span></div>
    <div class="sw" style="background:var(--slate-500);"><span style="color:var(--slate-0)">500</span></div>
    <div class="sw" style="background:var(--slate-600);"><span style="color:var(--slate-0)">600</span></div>
    <div class="sw" style="background:var(--slate-700);"><span style="color:var(--slate-0)">700</span></div>
    <div class="sw" style="background:var(--slate-800);"><span style="color:var(--slate-0)">800</span></div>
    <div class="sw" style="background:var(--slate-900);"><span style="color:var(--slate-0)">900</span></div>
  </div>
</body>
</html>
